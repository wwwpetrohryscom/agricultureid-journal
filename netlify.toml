# Netlify configuration for AgricultureID Journal.
#
# This is the SECOND of two Netlify projects serving one public hostname. The
# main AgricultureID project owns agricultureid.com and forwards /journal/* here
# with a proxy rewrite; this project serves those requests and nothing else. The
# mechanism, the alternatives examined and the evidence are recorded in the main
# repository at docs/journal-routing-architecture.md.
#
# The *.netlify.app hostname this project deploys to is INFRASTRUCTURE. It is
# never the Journal's public identity, it never appears in rendered output, and
# `npm run validate:seo` fails the build if it ever does.

[build]
  command = "npm run build"
  # `publish` is deliberately unset: the Next.js runtime resolves it from the
  # build output, exactly as on the main project.

# The Next.js runtime, declared explicitly.
#
# On the main AgricultureID project this is installed by Netlify's Git
# integration and pinning it is discouraged, so the adapter can update itself.
# A project created through the API does NOT get it installed, and without it
# Netlify publishes the `.next` directory as a folder of static files: the build
# succeeds, 198 files upload, and every URL returns Netlify's own 404 because
# nothing is serving the application. That was the first two deploys here.
#
# Declared without a version so it still updates on every build.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# --- De-indexing non-production contexts ------------------------------------
#
# X-Robots-Tag is scoped to preview and branch contexts and MUST NOT be applied
# to production. A proxy forwards the origin's response headers to the visitor:
# a blanket noindex on this project's production responses would travel through
# the rewrite and de-index the real agricultureid.com/journal URLs. app/robots.ts
# handles the production case by serving Disallow: / when the request is not
# reaching us through the canonical host.

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

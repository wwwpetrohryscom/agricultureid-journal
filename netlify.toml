# TEMPORARY DIAGNOSTIC BUILD — reverted in the next commit.
# Netlify's build log is not retrievable through the API for this account, so
# the build publishes its own log and always exits 0.
[build]
  command = "mkdir -p diag && (npm run build 2>&1 | tee diag/build.txt) ; echo exit_code=${PIPESTATUS[0]} >> diag/build.txt ; node -e \"console.log('node',process.version)\" >> diag/build.txt ; ls node_modules/.bin | head -40 >> diag/build.txt ; true"
  publish = "diag"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

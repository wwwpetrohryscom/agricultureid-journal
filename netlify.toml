# AgricultureID Journal is no longer hosted on Netlify.
#
# Since 2026-11 agricultureid.com/journal is served by the Cloudflare Worker
# `agricultureid-journal` from a static export (wrangler.jsonc,
# docs/journal-publishing-workflow.md). The Netlify project
# `agricultureid-journal` is kept only until the owner deletes it; it receives
# no traffic, because the knowledge platform no longer proxies /journal to it.
#
# `ignore` exiting 0 tells Netlify to skip every build, so merging an article
# no longer builds or publishes anything there. The Netlify-era configuration
# (the Next.js plugin, publish ".next", preview X-Robots-Tag headers) is in git
# history.

[build]
  ignore = "exit 0"
